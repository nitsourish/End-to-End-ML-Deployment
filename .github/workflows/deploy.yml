# =============================================================================
#  CD Pipeline — pure deployment: build image → push ECR → deploy App Runner
#
#  This workflow does NOT retrain the model. It trusts whatever artifacts
#  (scaler, selected_features) are already in the S3 feature store, and
#  whatever model version is registered as "Staging" in MLflow.
#
#  Retraining is only triggered by retrain.yml when Evidently detects drift.
#
#  Triggers
#  --------
#  1. Push to main/master          — code change deploy (no retrain)
#  2. workflow_dispatch            — manual deploy (no retrain)
#  3. Called from retrain.yml      — post-retrain deploy (artifacts already updated)
#
#  Required GitHub Secrets:
#    AWS_ACCESS_KEY_ID
#    AWS_SECRET_ACCESS_KEY
#    AWS_REGION                 (e.g. us-east-1)
#    AWS_ACCOUNT_ID
#    MLFLOW_TRACKING_URI        (e.g. http://<EC2-IP>:5000)
#    APPRUNNER_SERVICE_ARN      (from aws_setup.sh output)
#    FEATURE_STORE_BUCKET       (S3 bucket for raw data + feature store)
# =============================================================================

name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy (informational)"
        required: false
        default: "manual"

jobs:
  deploy:
    name: Build → Push ECR → Deploy App Runner
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ---- Pull latest pipeline artifacts from S3 -------------------------
      # The model artifacts (scaler.joblib, selected_features.json) were
      # written by the last retrain.yml run. Download them so they are baked
      # into the Docker image. If S3 download fails, the build aborts — we
      # never ship a container without a valid feature pipeline.
      - name: Download feature artifacts from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          FEATURE_STORE_BUCKET: ${{ secrets.FEATURE_STORE_BUCKET }}
        run: |
          mkdir -p artifacts/
          python - <<'EOF'
          import os, sys, logging
          logging.basicConfig(level=logging.INFO, format="%(levelname)s  %(message)s")
          sys.path.insert(0, ".")
          from src.feature_pipeline.feature_store import S3FeatureStore

          bucket = os.environ["FEATURE_STORE_BUCKET"]
          fs = S3FeatureStore(bucket)

          if not fs.ping():
              print(f"ERROR: Cannot reach s3://{bucket}", flush=True)
              sys.exit(1)

          scaler, meta = fs.load_artifacts(local_cache_dir="artifacts/")
          print(f"✅  Artifacts downloaded — {len(meta['selected_features'])} selected features")
          EOF

      # ---- AWS credentials ------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      # ---- ECR login -------------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ---- Build & push Docker image --------------------------------------
      # artifacts/ now contains the real scaler + features baked from the
      # last drift-triggered retrain, not a freshly retrained model.
      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/fraud-detection:${IMAGE_TAG}"
          LATEST_URI="${ECR_REGISTRY}/fraud-detection:latest"

          docker build \
            -f infrastructure/docker/Dockerfile \
            -t "${IMAGE_URI}" \
            -t "${LATEST_URI}" \
            .

          docker push "${IMAGE_URI}"
          docker push "${LATEST_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          echo "Pushed image: ${IMAGE_URI}"

      # ---- Deploy to App Runner -------------------------------------------
      - name: Deploy to App Runner
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          # Strip any trailing newlines/whitespace from secrets — a common
          # copy-paste artifact that produces "Invalid control character" JSON errors.
          MLFLOW_URI=$(printf '%s' "${MLFLOW_TRACKING_URI}" | tr -d '\r\n')

          # Write source-configuration to a temp file so special characters
          # in values (colons, slashes, newlines) never corrupt the JSON.
          cat > /tmp/apprunner_config.json <<APPCFG
          {
            "AutoDeploymentsEnabled": false,
            "AuthenticationConfiguration": {
              "AccessRoleArn": "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/fraud-detection-apprunner-ecr-role"
            },
            "ImageRepository": {
              "ImageIdentifier": "${IMAGE_URI}",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8000",
                "RuntimeEnvironmentVariables": {
                  "MLFLOW_TRACKING_URI": "${MLFLOW_URI}",
                  "FEATURE_STORE_BUCKET": "${{ secrets.FEATURE_STORE_BUCKET }}",
                  "MODEL_NAME": "fraud-detection-lr",
                  "MODEL_STAGE": "staging",
                  "FRAUD_THRESHOLD": "0.5",
                  "AWS_ACCESS_KEY_ID": "${{ secrets.AWS_ACCESS_KEY_ID }}",
                  "AWS_SECRET_ACCESS_KEY": "${{ secrets.AWS_SECRET_ACCESS_KEY }}",
                  "AWS_DEFAULT_REGION": "${{ secrets.AWS_REGION || 'us-east-1' }}"
                }
              }
            }
          }
          APPCFG

          aws apprunner update-service \
            --service-arn "${{ secrets.APPRUNNER_SERVICE_ARN }}" \
            --source-configuration "$(cat /tmp/apprunner_config.json)"

      # ---- Wait for deployment --------------------------------------------
      - name: Wait for App Runner to reach RUNNING
        run: |
          echo "Waiting for App Runner service …"
          for i in $(seq 1 20); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "${{ secrets.APPRUNNER_SERVICE_ARN }}" \
              --query 'Service.Status' --output text)
            echo "  [${i}/20] Status: ${STATUS}"
            if [ "${STATUS}" = "RUNNING" ]; then
              echo "✅  Service is RUNNING"
              exit 0
            fi
            sleep 30
          done
          echo "❌  Deployment timed out after 10 minutes"
          exit 1

      # ---- Smoke test -----------------------------------------------------
      - name: Smoke test deployed API
        run: |
          SERVICE_URL=$(aws apprunner describe-service \
            --service-arn "${{ secrets.APPRUNNER_SERVICE_ARN }}" \
            --query 'Service.ServiceUrl' --output text)

          echo "Smoke-testing https://${SERVICE_URL} …"

          # /health — liveness probe (container is up)
          echo "--- /health ---"
          curl --fail --silent --show-error "https://${SERVICE_URL}/health"
          echo ""

          # /ready — readiness probe (model loaded); show body on failure
          echo "--- /ready ---"
          READY_HTTP=$(curl --silent --output /tmp/ready_body.json \
            --write-out "%{http_code}" "https://${SERVICE_URL}/ready")
          cat /tmp/ready_body.json
          echo ""

          if [ "${READY_HTTP}" != "200" ]; then
            echo "❌  /ready returned HTTP ${READY_HTTP}"
            echo ""
            echo "Likely causes:"
            echo "  1. No model registered in MLflow at models:/fraud-detection-lr@staging"
            echo "     Fix: run training locally first, then re-deploy"
            echo "  2. MLFLOW_TRACKING_URI secret is wrong or EC2 is unreachable"
            echo "     Fix: curl \$MLFLOW_TRACKING_URI/health from the runner"
            echo "  3. Container still starting (App Runner health check too fast)"
            echo "     Fix: add 'sleep 30' before this step"
            exit 1
          fi

          # /info — model metadata (optional, informational)
          echo "--- /info ---"
          curl --silent "https://${SERVICE_URL}/info" | python3 -m json.tool || true

          echo ""
          echo "✅  Smoke tests passed — deploy complete"
