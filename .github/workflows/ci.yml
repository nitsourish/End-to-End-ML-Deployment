# =============================================================================
#  CI Pipeline — runs on every push and pull-request
#
#  Jobs:
#    lint      → ruff (fast linter, no formatting changes)
#    test      → pytest unit + integration tests (no AWS / MLflow server)
#    build     → Docker build smoke-test (image not pushed in CI)
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  # --------------------------------------------------------------------------
  # 1. Lint
  # --------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/ tests/ --select E,F,W --ignore E501

  # --------------------------------------------------------------------------
  # 2. Unit + Integration tests
  # --------------------------------------------------------------------------
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: "file:///tmp/mlruns-ci"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -x

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # --------------------------------------------------------------------------
  # 3. Docker build smoke-test
  # --------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]    # only if tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Create empty artifacts dir (for build context)
        run: mkdir -p artifacts

      - name: Build Docker image (no push)
        run: |
          docker build \
            -f infrastructure/docker/Dockerfile \
            -t fraud-detection:ci-${{ github.sha }} \
            .
